name: Update Star History

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/star_history.py
      - .github/workflows/star-history.yml
      - README.md
      - README.en.md
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history-main
  cancel-in-progress: true

jobs:
  chart:
    if: github.repository == 'cuiyx35/LightGBM-Metal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Render light and dark charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/star_history.py --repo "$GITHUB_REPOSITORY"
      - name: Commit changed charts
        run: |
          git add assets/star-history.svg assets/star-history-dark.svg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: update star history [skip ci]'
            git push origin HEAD:main
          fi
