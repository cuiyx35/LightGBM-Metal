name: Metal macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metal-smoke:
    name: Apple Silicon build and synthetic validation
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch source submodules
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --recursive; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 15))"
            fi
          done
          exit 1
      - name: Install build dependencies
        run: brew install cmake libomp
      - name: Create Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/metal-venv"
          "$RUNNER_TEMP/metal-venv/bin/python" -m pip install --disable-pip-version-check \
            numpy scipy pandas scikit-learn narwhals pytest
      - name: Build and validate Metal
        env:
          PYTHON_BIN: ${{ runner.temp }}/metal-venv/bin/python
        run: bash tools/build-metal-macos.sh --validate --jobs 2
      - name: Exercise Metal benchmark smoke workloads
        env:
          PYTHONPATH: ${{ github.workspace }}/python-package
          PYTHON_BIN: ${{ runner.temp }}/metal-venv/bin/python
        run: |
          # Validation scripts in the inventory run in the preceding step.
          # Execute every benchmark here with the checkout's native Metal library.
          while IFS= read -r example; do
            case "$example" in
              *_benchmark.py)
                "$PYTHON_BIN" "examples/python-guide/$example" \
                  --output "$RUNNER_TEMP/${example%.py}.json"
                ;;
              metal_validate.py|metal_resident_validate.py) ;;
              *) echo "Unknown Metal example: $example" >&2; exit 1 ;;
            esac
          done < .ci/metal-examples.txt
      - name: Check experiment CLI and render report
        run: |
          "$RUNNER_TEMP/metal-venv/bin/python" tools/metal_experiment.py doctor --json
          "$RUNNER_TEMP/metal-venv/bin/python" tools/metal_experiment.py report \
            --output "$RUNNER_TEMP/metal-report.html"
          "$RUNNER_TEMP/metal-venv/bin/python" -m pytest -q tests/test_metal_experiment_cli.py
      - name: Build experimental Metal wheel
        env:
          PYTHON_BIN: ${{ runner.temp }}/metal-venv/bin/python
        run: |
          "$PYTHON_BIN" -m pip install --disable-pip-version-check build
          bash tools/build-metal-wheel.sh
      - name: Install wheel in a clean environment
        run: |
          python3 -m venv "$RUNNER_TEMP/metal-wheel-venv"
          "$RUNNER_TEMP/metal-wheel-venv/bin/python" -m pip install --disable-pip-version-check numpy scipy narwhals
          "$RUNNER_TEMP/metal-wheel-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps dist/lightgbm-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/metal-wheel-venv/bin/python" - <<'PY'
          import numpy as np
          import lightgbm as lgb
          from lightgbm.libpath import _find_lib_path

          assert "metal-wheel-venv" in _find_lib_path()[0]
          rng = np.random.default_rng(29)
          x = rng.normal(size=(1000, 12)).astype("float32")
          y = (x[:, 0] + x[:, 1] > 0).astype("int8")
          model = lgb.train(
              {"device_type": "metal", "objective": "binary", "verbosity": -1, "num_threads": 2},
              lgb.Dataset(x, label=y),
              num_boost_round=4,
          )
          assert model.num_trees() == 4
          print("WHEEL_METAL_SMOKE_PASS")
          PY
      - name: Upload experimental wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lightgbm-metal-macos-arm64-wheel
          path: dist/lightgbm-*.whl
          if-no-files-found: error
