name: C++

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

env:
  # tell scripts where to put artifacts
  # (this variable name is left over from when jobs ran on Azure DevOps)
  BUILD_ARTIFACTSTAGINGDIRECTORY: '${{ github.workspace }}/artifacts'
  # where repo sources are cloned to
  BUILD_DIRECTORY: '${{ github.workspace }}'
  # in CMake-driven builds, parallelize compilation
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  test:
    name: ${{ matrix.task }} (${{ matrix.os-display-name || matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          #############
          # C++ tests #
          #############
          - os: ubuntu-latest
            task: cpp-tests
            compiler: clang-17
            method: with-sanitizers
            container: 'ubuntu:22.04'
            os-display-name: 'ubuntu22.04'
          - os: macos-15-intel
            task: cpp-tests
            compiler: clang
            method: with-sanitizers
            sanitizers: "address;undefined"
            container: null
          - os: windows-2022
            task: cpp-tests
            compiler: msvc
            container: null
          ###########
          # if-else #
          ###########
          # These test CLI-generated C++ inference code.
          #
          # They need Python because they're written with pytest, but they
          # do not need the LightGBM Python package
          - os: ubuntu-latest
            task: if-else
            compiler: clang-17
            container: 'ubuntu:22.04'
            os-display-name: 'ubuntu22.04'
            python_version: '3.14'
            setup-conda: 'true'
          - os: macos-15-intel
            task: if-else
            compiler: clang
            python_version: '3.10'
            container: null
          - os: ubuntu-latest
            task: if-else
            compiler: gcc
            python_version: '3.11'
            container: 'ghcr.io/lightgbm-org/lightgbm-vsts-agent:manylinux_2_28_x86_64'
            os-display-name: 'manylinux_2_28'
    steps:
      - name: Install packages used by third-party actions
        if: matrix.container == 'ubuntu:22.04'
        shell: bash
        run: |
          apt-get update -y
          apt-get install --no-install-recommends -y \
            dirmngr \
            gpg \
            gpg-agent \
            software-properties-common \
            sudo
          # install newest version of git
          # ref:
          #     - https://unix.stackexchange.com/a/170831/550004
          #     - https://git-scm.com/download/linux
          add-apt-repository ppa:git-core/ppa -y
          apt-get update -y
          apt-get install --no-install-recommends -y \
            git
      - name: Trust git cloning LightGBM
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 5
          persist-credentials: false
          submodules: true
      - name: Setup and run tests on Linux and macOS
        if: startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          export COMPILER="${{ matrix.compiler }}"
          export CONDA="${HOME}/miniforge"
          export METHOD="${{ matrix.method }}"
          export PATH=${CONDA}/bin:${PATH}
          export PYTHON_VERSION="${{ matrix.python_version }}"
          export SANITIZERS="${{ matrix.sanitizers }}"
          export SETUP_CONDA="${{ matrix.setup-conda }}"
          export TASK="${{ matrix.task }}"
          if [[ "${{ matrix.os }}" =~ ^macos ]]; then
              export OS_NAME="macos"
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
              export OS_NAME="linux"
          fi
          if [[ "${{ matrix.container }}" == "ubuntu:22.04" ]]; then
            export DEBIAN_FRONTEND=noninteractive
            export IN_UBUNTU_BASE_CONTAINER="true"
          fi
          $GITHUB_WORKSPACE/.ci/setup.sh
          $GITHUB_WORKSPACE/.ci/test.sh
      - name: Setup and run tests on Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh -command ". {0}"
        run: |
          $env:BUILD_SOURCESDIRECTORY = $env:BUILD_DIRECTORY
          $env:TASK = "${{ matrix.task }}"
          & "$env:GITHUB_WORKSPACE/.ci/test-windows.ps1"
  powerpc:
    name: cpp-tests (ubuntu24.04-ppc64le, gcc, QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          submodules: true
      - name: Set up PowerPC user-mode emulation
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          platforms: ppc64le
          cache-image: false
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
      - name: Build and run the complete PowerPC C++ test suite
        run: |
          # No native PowerPC hosted runner exists. Compile and execute the same
          # Debug/OpenMP test target under QEMU, without filtering any tests.
          docker run --rm --platform linux/ppc64le \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            ubuntu:noble-20260911@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 \
            bash -euo pipefail -c '
              test "$(uname -m)" = ppc64le
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --no-install-recommends -y build-essential cmake ca-certificates git
              cp -a /source /work
              cd /work
              cmake -B build -S . -DBUILD_CPP_TEST=ON -DUSE_DEBUG=ON
              cmake --build build --target testlightgbm -j2
              ./testlightgbm
            '
  all-cpp-jobs-successful:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test
      - powerpc
    permissions:
      statuses: read
    steps:
      - name: Note that all tests succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
